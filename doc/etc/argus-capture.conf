# Example configuration. Replace the placeholder host and port with values for
# your camera. Uncomment the credential lines only if your camera requires
# authentication, and keep any real config file readable only by the account
# that uses it.

[ArgusCapture]
workspace = .
# camera_only = keep files only on the camera
# workspace_only = download files to the workspace and remove them from the camera
# both = keep files on the camera and download them to the workspace
storage = workspace_only
camera = Camera1

[Camera1]
host = camera.example.local
port = 443
# username = your-camera-username
# password = your-camera-password
